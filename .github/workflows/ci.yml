name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python 3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # PostgreSQL + pgvector for tests/postgres and the PostgreSQL migration check.
    # A throwaway container that exists only for this job; the password is not a secret.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: easa
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: easa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easa -d easa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_URL: postgresql+psycopg://easa:ci-throwaway@localhost:5432/easa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"

      - name: Install dependencies (locked)
        run: uv sync --locked

      # Known vulnerabilities in the locked Python dependencies (PyPI advisory data).
      - name: Dependency audit
        run: uv run pip-audit --strict --progress-spinner off

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Tests (including PostgreSQL)
        env:
          EASA_TEST_POSTGRES_URL: ${{ env.PG_URL }}
          # Fail instead of skipping if the PostgreSQL tests cannot run.
          EASA_REQUIRE_POSTGRES_TESTS: "1"
        run: uv run pytest

      - name: Migrations apply and match models
        env:
          EASA_DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Migrations apply and match models (PostgreSQL)
        env:
          EASA_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic check

  web:
    name: Web (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      # Known vulnerabilities of high or critical severity in what the app ships.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  # Browser end-to-end tests (P8-M3): the built web app against the real API with the
  # fake chat model, the hashing embedder and a throwaway SQLite database
  # (apps/web/e2e/stack.mjs). No traces or reports are uploaded: traces record what
  # the tests type, including the generated passwords of the throwaway users.
  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"

      - name: Install API dependencies (locked)
        working-directory: apps/api
        run: uv sync --locked

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies (locked)
        run: npm ci

      # Playwright's own Chromium build and the system libraries it needs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npx playwright test

  # New or changed dependencies in a pull request: refuse known-vulnerable ones.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
