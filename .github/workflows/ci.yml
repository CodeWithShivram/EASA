name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python 3.14)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # PostgreSQL + pgvector for tests/postgres and the PostgreSQL migration check.
    # A throwaway container that exists only for this job; the password is not a secret.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: easa
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: easa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easa -d easa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PG_URL: postgresql+psycopg://easa:ci-throwaway@localhost:5432/easa
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # setup-uv publishes only exact release tags (no floating "v10" tag).
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.9"

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Tests (including PostgreSQL)
        env:
          EASA_TEST_POSTGRES_URL: ${{ env.PG_URL }}
        run: uv run pytest

      - name: Migrations apply and match models
        env:
          EASA_DATABASE_URL: sqlite:///${{ runner.temp }}/ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Migrations apply and match models (PostgreSQL)
        env:
          EASA_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          uv run alembic upgrade head
          uv run alembic check

  web:
    name: Web (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
