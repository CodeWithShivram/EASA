# Alembic configuration for the EASA API.
#
# The database URL is NOT set here. migrations/env.py reads it from the
# validated application settings (EASA_DATABASE_URL or apps/api/.env), so the
# app and migrations always target the same database and no credentials are
# stored in this file.
#
# Run from apps/api:  uv run alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Date-prefixed revision files sort chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Format newly generated migrations with the project's ruff configuration.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/Scripts/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = %(here)s/.venv/Scripts/ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
